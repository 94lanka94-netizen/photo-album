<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanka 的专属相册</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: '微软雅黑', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #d81b60;
            margin-bottom: 40px;
            font-size: 32px;
            letter-spacing: 2px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .photo-card:hover {
            transform: translateY(-5px);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 25px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📸 Lanka 的日常相册</h1>

    <div class="gallery-grid">
        <!-- 第一张照片（你已经找回来的那张） -->
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/114d4feb-346e-4d23-9aa0-a06f5b208b2a" alt="照片1">
        </div>
        
        <!-- 如果你想加第二张照片，就把下面这三行解除注释（或者直接复制上面那段），换个链接 -->
        <!-- 
        <div class="photo-card">
            <img src="这里放第二张照片的链接" alt="照片2">
        </div>
        -->
    </div>

    <a href="https://94lanka94-netizen.github.io/NO.1-Lanka/" class="back-link">返回我的主页</a>

</body>
</html>
