<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanka 的专属相册</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: '微软雅黑', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        h1 { color: #d81b60; margin-bottom: 40px; font-size: 32px; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }
        .photo-card {
            background: #f5f5f5;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .photo-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }
        .back-link {
            display: inline-block;
            padding: 10px 25px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📸 Lanka 的日常相册</h1>

    <div class="gallery-grid">
        <!-- 第一张照片 -->
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/114d4feb-346e-4d23-9aa0-a06f5b208b2a" alt="照片1">
        </div>

        <!-- 第二张照片（用了你最新提供的干净链接） -->
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/ea8682f0-dae9-4f42-aaec-bc3540da58a9" alt="照片2">
        </div>
    </div>

    <!-- 返回主页的按钮 -->
    <a href="https://94lanka94-netizen.github.io/NO.1-Lanka/" class="back-link">返回我的主页</a>

    <!-- 悬浮返回顶部按钮 -->
    <button id="backToTopBtn" title="返回顶部">↑</button>
    <style>
        #backToTopBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            background-color: #d81b60;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
    <script>
        const topBtn = document.getElementById("backToTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                topBtn.style.display = "block";
            } else {
                topBtn.style.display = "none";
            }
        };
        topBtn.onclick = function() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        };
    </script>

</body>
</html>
